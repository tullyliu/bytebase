name: Build and push patched image

on:
  push:
    branches:
      - 'patched'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-patched-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract build args
        # Release tags live upstream; pushing them to the fork would trigger draft-release.yml.
        # VERSION is `<base release tag>-patched.<commits since that tag>`, e.g. 3.23.1-patched.2.
        run: |
          git fetch --quiet https://github.com/bytebase/bytebase.git 'refs/tags/*:refs/tags/*'
          BASE_TAG="$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*')"
          VERSION="${BASE_TAG}-patched.$(git rev-list --count "${BASE_TAG}..HEAD")"
          {
            echo "VERSION=${VERSION}"
            echo "GIT_COMMIT=$(git rev-parse HEAD)"
            echo "SHORT_SHA=$(git rev-parse --short=10 HEAD)"
          } >> "$GITHUB_ENV"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }}
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            GIT_COMMIT=${{ env.GIT_COMMIT }}
      - name: Summary
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Image | \`ghcr.io/${{ github.repository }}:${SHORT_SHA}\` |"
            echo "| Digest | \`ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
